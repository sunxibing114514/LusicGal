name: engines

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# 配额说明：四个必绿门禁合并为一个 ubuntu job（省去重复 setup）；
# 实验性核心编译仅在 workflow_dispatch 手动触发时运行（上游体积大、耗时长）。
jobs:
  gates:
    name: 必绿门禁（C ABI / JNI / Rust FFI / 上游 pin）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: C ABI selftest (host gcc)
        run: |
          cmake -S native/selftest -B build-selftest
          cmake --build build-selftest
          ./build-selftest/lusicgal_selftest
      - name: locate NDK
        run: |
          NDK="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | sort -V | tail -1)"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "未找到 NDK"; exit 1
          fi
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "使用 NDK: $NDK"
      - name: JNI bridge ×NDK arm64-v8a
        run: |
          cmake -S native/bridge -B build-bridge \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-bridge
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust FFI gate (cargo check + test)
        run: |
          cargo check --manifest-path native/rust/cbridge/Cargo.toml
          cargo test --manifest-path native/rust/cbridge/Cargo.toml
      - name: 18 个上游 pin 校验
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch_engines.sh --verify
      - uses: actions/upload-artifact@v4
        with:
          name: lusicgal-bridge-arm64
          path: build-bridge/liblusicgal_bridge.a
          if-no-files-found: error

  onscripter-android:
    name: 实验：OnscripterYuri ×NDK（手动，非阻塞）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: fetch upstream
        run: bash scripts/fetch_engines.sh onscripter-yuri
      - name: cross compile
        run: bash native/engines/onscripter/build_android.sh

  sena-android:
    name: 实验：sena-rs ×Android target（手动，非阻塞）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: fetch upstream
        run: bash scripts/fetch_engines.sh sena-rs
      - name: cargo check (aarch64-linux-android)
        run: bash native/engines/sena/build_android.sh
