name: engines

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# 配额说明：必绿门禁合并为一个 ubuntu job；真实核心构建
# （sena/rfvp/siglus/artemis = Rust 交叉编译，产出 .so artifact）在
# push 时即跑（rust-cache 缓存重依赖）；C/C++ 实验核心（onscripter/
# xsystem35/kirikiri）仅在 workflow_dispatch 手动触发时运行且非阻塞。
jobs:
  gates:
    name: 必绿门禁（C ABI / JNI / Rust FFI / 上游 pin）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: C ABI selftest (host gcc)
        run: |
          cmake -S native/selftest -B build-selftest
          cmake --build build-selftest
          ./build-selftest/lusicgal_selftest
      - name: locate NDK
        run: |
          NDK="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | sort -V | tail -1)"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "未找到 NDK"; exit 1
          fi
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "使用 NDK: $NDK"
      - name: JNI bridge ×NDK arm64-v8a
        run: |
          cmake -S native/bridge -B build-bridge \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-bridge
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust FFI gate (cargo check + test)
        run: |
          cargo check --manifest-path native/rust/cbridge/Cargo.toml
          cargo test --manifest-path native/rust/cbridge/Cargo.toml
      - name: 19 个上游 pin 校验
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch_engines.sh --verify
      - uses: actions/upload-artifact@v4
        with:
          name: lusicgal-bridge-arm64
          path: build-bridge/liblusicgal_bridge.so
          if-no-files-found: error

  rust-cores:
    name: 真核：Rust 四核交叉编译（sena/rfvp/siglus/artemis）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [sena, rfvp, siglus, artemis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-android@v3
        with:
          packages: ''
      - name: locate NDK
        run: |
          NDK="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | sort -V | tail -1)"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "未找到 NDK"; exit 1
          fi
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/rust/shells/sena
            native/rust/shells/rfvp
            native/rust/shells/siglus
            native/rust/shells/artemis
      - name: fetch upstream + 补丁（仅该核心所需）
        run: |
          case "${{ matrix.engine }}" in
            sena)    bash scripts/fetch_engines.sh sena-rs;       bash scripts/patch_engines.sh sena ;;
            rfvp)    bash scripts/fetch_engines.sh rfvp;          bash scripts/patch_engines.sh rfvp ;;
            siglus)  bash scripts/fetch_engines.sh siglus-rs;     bash scripts/patch_engines.sh siglus ;;
            artemis) bash scripts/fetch_engines.sh art3m1s-core;  bash scripts/patch_engines.sh artemis || true ;;
          esac
      - name: build liblusicgal_${{ matrix.engine }}.so
        run: bash native/engines/${{ matrix.engine }}/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lusicgal-core-${{ matrix.engine }}-arm64
          path: build/cores/${{ matrix.engine }}/arm64-v8a/*.so
          if-no-files-found: error

  onscripter-android:
    name: 实验：OnscripterYuri ×NDK（手动，非阻塞）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: fetch upstream
        run: bash scripts/fetch_engines.sh onscripter-yuri
      - name: cross compile
        run: bash native/engines/onscripter/build_android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lusicgal-core-onscripter-arm64
          path: build/cores/onscripter/arm64-v8a/*.so
          if-no-files-found: warn

  xsystem35-android:
    name: 实验：xsystem35-sdl2 ×NDK（手动，非阻塞）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: fetch upstream
        run: bash scripts/fetch_engines.sh xsystem35-sdl2
      - name: cross compile
        run: bash native/engines/xsystem35/build_android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lusicgal-core-xsystem35-arm64
          path: build/cores/xsystem35/arm64-v8a/*.so
          if-no-files-found: warn

  kirikiri-android:
    name: 实验：KrKr2-Next ×NDK+vcpkg（手动，非阻塞）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: fetch upstream + vcpkg
        run: |
          bash scripts/fetch_engines.sh kirikiri-next
          # 完整历史：manifest 版本解析要 git show 旧 baseline/版本库提交
          # （--depth 1 实测 "exists on disk, but not in <commit>" 必败）。
          git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg || true
          /tmp/vcpkg/bootstrap-vcpkg.sh || true
          echo "VCPKG_ROOT=/tmp/vcpkg" >> "$GITHUB_ENV"
      - name: cross compile
        run: |
          # NDK 由 build_android.sh 自动探测（ANDROID_HOME/ndk/*）。
          # vcpkg 港口风暴内存平稳；CI 内存宽裕，并发 2 提速。
          export VCPKG_MAX_CONCURRENCY=2
          bash native/engines/kirikiri/build_android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lusicgal-core-kirikiri-arm64
          path: build/cores/kirikiri/arm64-v8a/*.so
          if-no-files-found: warn

  renpy-module:
    name: 实验：Ren'Py 外板壳 staging（手动，非阻塞）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: fetch upstream（renpy-build + renpy 运行时树）
        run: |
          bash scripts/fetch_engines.sh renpy-build
          bash scripts/fetch_engines.sh renpy
      - name: stage 模块（librenpython.so + Java + 运行时资产）
        run: bash modules/renpy/build_android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lusicgal-renpy-module-staging
          path: modules/renpy/build-out/
          if-no-files-found: warn
