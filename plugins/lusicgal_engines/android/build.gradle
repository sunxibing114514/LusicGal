group = "com.lusicgal.engines"
version = "0.1.0"

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = "com.lusicgal.engines"
    compileSdk = 36

    defaultConfig {
        minSdk = 21
        // NDK 版本钉死（本地/CI 环境一致；AGP 9.x 默认 NDK 未必安装）。
        ndkVersion = '27.2.12479018'
        // 桥（liblusicgal_bridge.so）只构建 64 位 + 模拟器 ABI；
        // 其余 ABI 下 App 优雅降级（探测报告核心缺失）。
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                // 桥不链接核心（dlsym 运行期派发），无额外参数。
                arguments '-DANDROID_STL=none'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../../native/bridge/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}
